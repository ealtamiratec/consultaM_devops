- apiVersion: v1
  data:
    database.sql: "-- =====================================================\n-- Sistema
      de Atención Médica - Consulta Externa\n-- Base de Datos MySQL\n-- =====================================================\n\n--
      Crear base de datos\nCREATE DATABASE IF NOT EXISTS consulta_medica \nCHARACTER
      SET utf8mb4 \nCOLLATE utf8mb4_unicode_ci;\n\nUSE consulta_medica;\n\n-- =====================================================\n--
      Tabla de Usuarios (para autenticación)\n-- =====================================================\nCREATE
      TABLE IF NOT EXISTS usuarios (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    username
      VARCHAR(50) NOT NULL UNIQUE,\n    email VARCHAR(100) NOT NULL UNIQUE,\n    password
      VARCHAR(255) NOT NULL,\n    nombre_completo VARCHAR(150) NOT NULL,\n    rol
      ENUM('admin', 'medico', 'recepcionista') NOT NULL DEFAULT 'recepcionista',\n
      \   activo TINYINT(1) NOT NULL DEFAULT 1,\n    ultimo_acceso DATETIME NULL,\n
      \   token_recuperacion VARCHAR(100) NULL,\n    token_expiracion DATETIME NULL,\n
      \   created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP
      DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n    INDEX idx_username
      (username),\n    INDEX idx_email (email),\n    INDEX idx_rol (rol)\n) ENGINE=InnoDB;\n\n--
      =====================================================\n-- Tabla de Pacientes\n--
      =====================================================\nCREATE TABLE IF NOT EXISTS
      pacientes (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    numero_historia VARCHAR(20)
      NOT NULL UNIQUE,\n    tipo_documento ENUM('DNI', 'CE', 'Pasaporte', 'Otro')
      NOT NULL DEFAULT 'DNI',\n    numero_documento VARCHAR(20) NOT NULL UNIQUE,\n
      \   nombres VARCHAR(100) NOT NULL,\n    apellido_paterno VARCHAR(50) NOT NULL,\n
      \   apellido_materno VARCHAR(50) NULL,\n    fecha_nacimiento DATE NOT NULL,\n
      \   sexo ENUM('M', 'F', 'Otro') NOT NULL,\n    estado_civil ENUM('Soltero',
      'Casado', 'Divorciado', 'Viudo', 'Conviviente') NULL,\n    direccion VARCHAR(255)
      NULL,\n    telefono VARCHAR(20) NULL,\n    email VARCHAR(100) NULL,\n    grupo_sanguineo
      VARCHAR(5) NULL,\n    alergias TEXT NULL,\n    antecedentes TEXT NULL,\n    contacto_emergencia
      VARCHAR(100) NULL,\n    telefono_emergencia VARCHAR(20) NULL,\n    activo TINYINT(1)
      NOT NULL DEFAULT 1,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at
      TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n    INDEX
      idx_numero_historia (numero_historia),\n    INDEX idx_documento (tipo_documento,
      numero_documento),\n    INDEX idx_nombres (nombres, apellido_paterno)\n) ENGINE=InnoDB;\n\n--
      =====================================================\n-- Tabla de Especialidades
      Médicas\n-- =====================================================\nCREATE TABLE
      IF NOT EXISTS especialidades (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    nombre
      VARCHAR(100) NOT NULL UNIQUE,\n    descripcion TEXT NULL,\n    activo TINYINT(1)
      NOT NULL DEFAULT 1,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at
      TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\n) ENGINE=InnoDB;\n\n--
      =====================================================\n-- Tabla de Médicos\n--
      =====================================================\nCREATE TABLE IF NOT EXISTS
      medicos (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    usuario_id INT NULL,\n
      \   codigo_medico VARCHAR(20) NOT NULL UNIQUE,\n    numero_colegiatura VARCHAR(20)
      NOT NULL UNIQUE,\n    nombres VARCHAR(100) NOT NULL,\n    apellido_paterno VARCHAR(50)
      NOT NULL,\n    apellido_materno VARCHAR(50) NULL,\n    especialidad_id INT NOT
      NULL,\n    telefono VARCHAR(20) NULL,\n    email VARCHAR(100) NULL,\n    horario_atencion
      VARCHAR(255) NULL,\n    activo TINYINT(1) NOT NULL DEFAULT 1,\n    created_at
      TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      ON UPDATE CURRENT_TIMESTAMP,\n    FOREIGN KEY (usuario_id) REFERENCES usuarios(id)
      ON DELETE SET NULL,\n    FOREIGN KEY (especialidad_id) REFERENCES especialidades(id)
      ON DELETE RESTRICT,\n    INDEX idx_codigo_medico (codigo_medico),\n    INDEX
      idx_colegiatura (numero_colegiatura),\n    INDEX idx_especialidad (especialidad_id)\n)
      ENGINE=InnoDB;\n\n-- =====================================================\n--
      Tabla de Consultas Médicas (Atenciones)\n-- =====================================================\nCREATE
      TABLE IF NOT EXISTS consultas (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    numero_consulta
      VARCHAR(20) NOT NULL UNIQUE,\n    paciente_id INT NOT NULL,\n    medico_id INT
      NOT NULL,\n    fecha_consulta DATE NOT NULL,\n    hora_consulta TIME NOT NULL,\n
      \   tipo_consulta ENUM('Primera vez', 'Control', 'Emergencia', 'Referencia')
      NOT NULL DEFAULT 'Primera vez',\n    estado ENUM('Programada', 'En espera',
      'En atención', 'Atendida', 'Cancelada', 'No asistió') NOT NULL DEFAULT 'Programada',\n
      \   motivo_consulta TEXT NOT NULL,\n    sintomas TEXT NULL,\n    examen_fisico
      TEXT NULL,\n    diagnostico TEXT NULL,\n    tratamiento TEXT NULL,\n    observaciones
      TEXT NULL,\n    proxima_cita DATE NULL,\n    usuario_registro_id INT NOT NULL,\n
      \   created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP
      DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n    FOREIGN KEY (paciente_id)
      REFERENCES pacientes(id) ON DELETE RESTRICT,\n    FOREIGN KEY (medico_id) REFERENCES
      medicos(id) ON DELETE RESTRICT,\n    FOREIGN KEY (usuario_registro_id) REFERENCES
      usuarios(id) ON DELETE RESTRICT,\n    INDEX idx_numero_consulta (numero_consulta),\n
      \   INDEX idx_paciente (paciente_id),\n    INDEX idx_medico (medico_id),\n    INDEX
      idx_fecha (fecha_consulta),\n    INDEX idx_estado (estado)\n) ENGINE=InnoDB;\n\n--
      =====================================================\n-- Tabla de Signos Vitales\n--
      =====================================================\nCREATE TABLE IF NOT EXISTS
      signos_vitales (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    consulta_id INT
      NOT NULL,\n    presion_sistolica INT NULL,\n    presion_diastolica INT NULL,\n
      \   frecuencia_cardiaca INT NULL,\n    frecuencia_respiratoria INT NULL,\n    temperatura
      DECIMAL(4,2) NULL,\n    peso DECIMAL(5,2) NULL,\n    talla DECIMAL(4,2) NULL,\n
      \   imc DECIMAL(4,2) NULL,\n    saturacion_oxigeno INT NULL,\n    created_at
      TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (consulta_id) REFERENCES
      consultas(id) ON DELETE CASCADE\n) ENGINE=InnoDB;\n\n-- =====================================================\n--
      Tabla de Logs de Auditoría\n-- =====================================================\nCREATE
      TABLE IF NOT EXISTS audit_logs (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    usuario_id
      INT NULL,\n    accion VARCHAR(50) NOT NULL,\n    tabla_afectada VARCHAR(50)
      NOT NULL,\n    registro_id INT NULL,\n    datos_anteriores JSON NULL,\n    datos_nuevos
      JSON NULL,\n    ip_address VARCHAR(45) NULL,\n    user_agent TEXT NULL,\n    created_at
      TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    INDEX idx_usuario (usuario_id),\n
      \   INDEX idx_accion (accion),\n    INDEX idx_tabla (tabla_afectada),\n    INDEX
      idx_fecha (created_at)\n) ENGINE=InnoDB;\n\n-- =====================================================\n--
      Datos Iniciales\n-- =====================================================\n\n--
      Insertar especialidades médicas básicas\nINSERT INTO especialidades (nombre,
      descripcion) VALUES\n('Medicina General', 'Atención médica primaria y preventiva'),\n('Pediatría',
      'Atención médica para niños y adolescentes'),\n('Ginecología', 'Salud reproductiva
      femenina'),\n('Cardiología', 'Enfermedades del corazón y sistema cardiovascular'),\n('Dermatología',
      'Enfermedades de la piel'),\n('Traumatología', 'Lesiones del sistema músculo-esquelético'),\n('Oftalmología',
      'Enfermedades de los ojos'),\n('Otorrinolaringología', 'Enfermedades de oído,
      nariz y garganta'),\n('Neurología', 'Enfermedades del sistema nervioso'),\n('Psiquiatría',
      'Trastornos mentales y emocionales');\n\n-- Insertar usuario administrador por
      defecto\n-- Password: Admin123! (hasheado con password_hash de PHP)\nINSERT
      INTO usuarios (username, email, password, nombre_completo, rol) VALUES\n('admin',
      'admin@consultamedica.local', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi',
      'Administrador del Sistema', 'admin');\n\n-- Insertar médico de ejemplo\nINSERT
      INTO medicos (codigo_medico, numero_colegiatura, nombres, apellido_paterno,
      apellido_materno, especialidad_id, telefono, email) VALUES\n('MED001', 'CMP-12345',
      'Juan Carlos', 'García', 'López', 1, '999888777', 'jgarcia@consultamedica.local');\n\n--
      Insertar paciente de ejemplo\nINSERT INTO pacientes (numero_historia, tipo_documento,
      numero_documento, nombres, apellido_paterno, apellido_materno, fecha_nacimiento,
      sexo, direccion, telefono) VALUES\n('HC-000001', 'DNI', '12345678', 'María Elena',
      'Rodríguez', 'Sánchez', '1985-03-15', 'F', 'Av. Principal 123', '987654321');\n"
  immutable: false
